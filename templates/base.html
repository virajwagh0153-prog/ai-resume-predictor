<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}ResumeAI{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body>
<div class="bg-orb orb1"></div><div class="bg-orb orb2"></div>
<nav class="navbar navbar-expand-lg glass-nav">
 <div class="container">
  <a class="navbar-brand fw-bold text-white" href="/">Resume<span>AI</span></a>
  <div class="d-flex gap-2 align-items-center">
   {% if session.get('user_id') %}
   <a class="nav-link text-white" href="/dashboard">Dashboard</a>
   <a class="btn btn-sm btn-outline-light" href="/logout">Logout</a>
   {% else %}
   <a class="nav-link text-white" href="/login">Login</a>
   <a class="btn btn-sm btn-primary px-3" href="/register">Get Started</a>
   {% endif %}
  </div>
 </div>
</nav>
<main>{% with messages=get_flashed_messages() %}{% if messages %}
<div class="container mt-3">{% for m in messages %}<div class="alert alert-warning glass-alert">{{m}}</div>{% endfor %}</div>
{% endif %}{% endwith %}{% block content %}{% endblock %}</main>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body></html>
