{% extends "base.html" %}{% block title %}Register | ResumeAI{% endblock %}
{% block content %}<div class="auth-wrap"><div class="auth-card">
<div class="badge-soft">START YOUR JOURNEY</div><h2>Create your account</h2><p class="muted">Build your AI-powered career profile.</p>
<form method="post"><label>Full name</label><input name="name" required placeholder="Your name">
<label>Email</label><input name="email" type="email" required placeholder="you@example.com">
<label>Password</label><input name="password" type="password" required minlength="6" placeholder="Minimum 6 characters">
<button class="btn btn-primary w-100 mt-3">Create Account →</button></form>
<p class="mt-4 muted">Already registered? <a href="/login">Login</a></p>
</div></div>{% endblock %}
